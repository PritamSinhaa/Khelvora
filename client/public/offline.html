<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07141e" />
    <title>You're offline - Khelvora</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #07141e; color: #f4f7f8; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 34rem; padding: 32px; border: 1px solid #263947; border-radius: 20px; background: #101f2b; }
      h1 { margin: 0 0 12px; color: #c6ff36; font-size: 2rem; }
      p { color: #b3c0c9; line-height: 1.6; }
      button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 10px; background: #c6ff36; color: #07141e; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>KHELVORA</p>
      <h1>You're offline</h1>
      <p>Reconnect to load matches, teams, messages, and your account.</p>
      <p>Signing in, joining games, sending messages, and other changes need a connection. Nothing is saved or queued while offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
